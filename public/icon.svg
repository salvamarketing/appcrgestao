          fill="url(#crBlue)" stroke="#00184d" stroke-width="4" stroke-linejoin="round" />

    <!-- Wrench -->
    <g transform="translate(485, 95)">
      <path d="M 126 124 L 65 185 C 55 195, 55 212, 65 222 C 76 232, 92 232, 102 222 L 164 160 C 178 170, 196 174, 215 168 C 226 164, 238 156, 246 146 L 204 124 C 196 120, 190 110, 192 100 C 194 90, 202 82, 212 80 L 240 76 C 232 58, 218 45, 200 40 C 172 32, 145 44, 132 68 C 126 80, 126 94, 130 106 L 126 124 Z"
