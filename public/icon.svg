    <path d="M 235 152 C 228 108, 195 72, 142 72 C 80 72, 35 125, 35 210 C 35 295, 80 348, 142 348 C 198 348, 230 312, 238 266 L 176 250 C 170 274, 155 296, 138 296 C 106 296, 88 260, 88 210 C 88 160, 106 124, 138 124 C 156 124, 170 144, 175 168 Z"
