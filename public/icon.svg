  <!-- Brand Subtext -->
  <text x="256" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="3">CR SERVIÇOS</text>
  <text x="256" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="19" fill="#38bdf8" text-anchor="middle" letter-spacing="2">GESTÃO OPERACIONAL 24H</text>
</svg>
