<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#080e1e" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Royal Blue Gradient -->
    <linearGradient id="crBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0062e3" />
      <stop offset="50%" stop-color="#004ecc" />
      <stop offset="100%" stop-color="#002d8f" />
    </linearGradient>

    <!-- Cyan Highlight -->
