    <path d="M 245 76 L 345 76 C 382 76, 408 98, 408 142 C 408 178, 385 200, 350 206 L 420 344 L 360 344 L 298 220 L 298 344 L 245 344 Z M 298 122 L 298 176 L 338 176 C 354 176, 365 166, 365 148 C 365 132, 354 122, 338 122 Z"
