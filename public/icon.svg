    <path d="M 235 152 C 228 108, 195 72, 142 72 C 80 72, 35 125, 35 210 C 35 155, 80 82, 142 82 C 192 82, 222 116, 231 154 Z"
          fill="url(#crCyan)" opacity="0.65" />

