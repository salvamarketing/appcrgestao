<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 765 375" width="100%" height="100%" fill="none" style="overflow: visible;">
  <defs>
    <!-- Royal Blue Gradient for Main Letters -->
    <linearGradient id="crBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0062e3" />
      <stop offset="45%" stop-color="#004ecc" />
      <stop offset="85%" stop-color="#002d8f" />
      <stop offset="100%" stop-color="#001a59" />
    </linearGradient>

    <!-- Cyan Specular Lighting Highlight for Letters and Wrench -->
    <linearGradient id="crCyanHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="30%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Metallic Wrench Upper Facet Highlight -->
    <linearGradient id="wrenchLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Metallic Wrench Lower / Shadow Facet -->
    <linearGradient id="wrenchDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0041a8" />
      <stop offset="60%" stop-color="#002773" />
      <stop offset="100%" stop-color="#001542" />
    </linearGradient>

    <!-- Bracket Blue Gradient -->
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080ff" />
      <stop offset="40%" stop-color="#0055d4" />
      <stop offset="100%" stop-color="#002b80" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter for 3D realism -->
    <filter id="crShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="crGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#crShadow)">
    <!-- ==================== LETTER "C" ==================== -->
    <!-- 3D Base Outer Bevel -->
    <path d="M 235 152 
             C 228 108, 195 72, 142 72 
             C 80 72, 35 125, 35 210 
             C 35 295, 80 348, 142 348 
             C 198 348, 230 312, 238 266 
             L 176 250 
             C 170 274, 155 296, 138 296 
             C 106 296, 88 260, 88 210 
             C 88 160, 106 124, 138 124 
             C 156 124, 170 144, 175 168 
             Z"
          fill="url(#crBlueGrad)"
          stroke="#001f66"
          stroke-width="5"
          stroke-linejoin="round" />

    <!-- Letter C Top Inner Specular Lip -->
    <path d="M 235 152 
             C 228 108, 195 72, 142 72 
             C 80 72, 35 125, 35 210 
             C 35 155, 80 82, 142 82 
             C 192 82, 222 116, 231 154 
             Z"
          fill="url(#crCyanHighlight)"
          opacity="0.65" />

    <!-- ==================== LETTER "R" ==================== -->
    <!-- Main R Glyph -->
    <path d="M 245 76 
             L 345 76 
             C 382 76, 408 98, 408 142 
             C 408 178, 385 200, 350 206 
             L 420 344 
             L 360 344 
             L 298 220 
             L 298 344 
             L 245 344 
             Z 
             M 298 122 
             L 298 176 
             L 338 176 
             C 354 176, 365 166, 365 148 
             C 365 132, 354 122, 338 122 
             Z"
          fill="url(#crBlueGrad)"
          stroke="#001f66"
          stroke-width="5"
          stroke-linejoin="round" />

    <!-- Letter R Top Specular Curve -->
    <path d="M 245 76 
             L 345 76 
             C 382 76, 408 98, 408 142 
             C 408 118, 375 84, 342 84 
             L 252 84 
             L 252 76 
             Z"
          fill="url(#crCyanHighlight)"
          opacity="0.75" />

    <!-- ==================== TECH BRACKET EMBLEM ==================== -->
    <!-- Outer Hook Bracket Frame -->
    <path d="M 450 162 
             L 476 162 
             L 476 178 
             L 490 178 
             L 490 102 
             C 490 68, 510 52, 546 52 
             L 590 52 
             L 590 74 
             L 548 74 
             C 528 74, 516 82, 516 102 
             L 516 178 
             L 528 178 
             L 528 162 
             L 552 162 
             L 552 186 
             L 538 186 
             L 538 274 
             C 538 316, 566 338, 614 338 
             C 650 338, 672 320, 672 284 
             L 672 242 
             L 692 242 
             L 692 286 
             C 692 336, 658 358, 610 358 
             C 544 358, 512 324, 512 268 
             L 512 186 
             L 450 186 
             Z"
          fill="url(#bracketGrad)"
          stroke="#00184d"
          stroke-width="3"
          stroke-linejoin="round" />

    <!-- Bracket Inner Glow Highlight -->
    <path d="M 490 102 
             C 490 68, 510 52, 546 52 
             L 590 52 
             L 590 60 
             L 546 60 
             C 516 60, 498 74, 498 102 
             Z" 
          fill="#38bdf8" 
          opacity="0.8" />

    <!-- ==================== WRENCH (CHAVE DE BOCA) ==================== -->
    <!-- Wrench Body & Head in High-Contrast Diagonal 45-degree angle -->
    <g transform="translate(485, 95)">
      <!-- Wrench Shadow / Lower Half -->
      <path d="M 68 182 
               L 125 125 
               L 155 155 
               L 98 212 
               C 85 225, 62 225, 48 212 
               C 35 198, 35 176, 48 162 
               L 68 182 Z"
            fill="url(#wrenchDark)" />

      <!-- Wrench Full Spanner Tool Outline -->
      <!-- Jaw Head pointing Up-Right (~45 deg) -->
      <path d="M 126 124 
               L 65 185 
               C 55 195, 55 212, 65 222 
               C 76 232, 92 232, 102 222 
               L 164 160 
               C 178 170, 196 174, 215 168 
               C 226 164, 238 156, 246 146 
               L 204 124 
               C 196 120, 190 110, 192 100 
               C 194 90, 202 82, 212 80 
               L 240 76 
               C 232 58, 218 45, 200 40 
               C 172 32, 145 44, 132 68 
               C 126 80, 126 94, 130 106 
               L 126 124 Z"
            fill="url(#wrenchLight)"
            stroke="#002d8f"
            stroke-width="3"
            stroke-linejoin="round" />

      <!-- Wrench Two-Tone Inner Shadow for Jaw & Shaft -->
      <path d="M 126 124 
               L 65 185 
               C 55 195, 55 212, 65 222 
               L 75 212 
               L 134 153 
               C 142 161, 153 166, 164 160 
               L 164 160 
               L 126 124 Z" 
            fill="url(#wrenchDark)" 
            opacity="0.45" />

      <!-- Wrench Center Ridge / Highlight Line -->
      <path d="M 80 206 
               L 142 144 
               C 148 138, 155 136, 162 138" 
            stroke="#ffffff" 
            stroke-width="2.5" 
            stroke-linecap="round" 
            opacity="0.6" />
    </g>
  </g>
</svg>
